name: Analyze

on:
  push:
    branches:
      - main
      - week2-functional-testing
  pull_request:
    branches:
      - main
      - week2-functional-testing
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talkdesk
          POSTGRES_PASSWORD: talkdesk
          POSTGRES_DB: talkdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talkdesk -d talkdesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r talkdesk/python/requirements.txt
          python -m pip install -r talkdesk/tests/requirements-dev.txt
          python -m pip install httpx

      - name: Initialize TalkDesk database
        env:
          PGPASSWORD: talkdesk
        run: |
          psql -h localhost -U talkdesk -d talkdesk -f talkdesk/db/01-schema.sql
          psql -h localhost -U talkdesk -d talkdesk -f talkdesk/db/02-seed.sql

      - name: Run tests and generate coverage
        working-directory: talkdesk
        env:
          PYTHONPATH: python
          DB_URL: postgresql://talkdesk:talkdesk@localhost:5432/talkdesk
        run: |
          pytest tests/integration tests/e2e -q \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:../coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


